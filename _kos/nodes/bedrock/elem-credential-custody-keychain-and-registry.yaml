id: elem-credential-custody-keychain-and-registry
type: element
confidence: bedrock
title: "Credential custody: client secret and registry password live in the platform keyring"
content: |
  stave holds two long-lived secrets for the user, and both sit in the
  platform keyring, never in the repo and never in a derived artifact
  that outlives them. This node is the graph home of charter B3 (the
  client secret) and B5 (the registry credential).

  **Client secret (B3).** Resolved env, then platform keyring (`stave
  auth login` prompts and stores), then config (discouraged), then a
  chain-naming error. Minted access tokens are short-lived derivatives:
  they are cached in the XDG state dir (mode 0600), keyed by
  (token_url, client_id), and never written to config or keyring.

  **Registry password (B5).** `stave registry login` stores it in the
  keyring on the same env, keyring, config chain; `stave registry
  credential --reveal` feeds `docker login --password-stdin`. The
  username embeds the tenant ID, so it is tenant-identifying.

  **Keyring backend.** The keyring crate's v3 to v4 move is a crate
  split, not a feature rename. The v1 facade keeps stave's simple
  `Entry` surface unchanged, no auth-module code changed, and a client
  secret written under v3 reads back under v4 with no re-authentication
  and no Keychain prompt (measured 2026-09-18). Evidence:
  `_kos/findings/finding-011-keyring-v3-to-v4-crate-split-replay.md`
  (finding-011), a replay of sidestep's reference finding.

  Authority for the bedrock tier: the operator's ruling of 2026-10-09
  (option a, stave finding-011 node), relayed by director.
