id: elem-second-route-when-the-credential-will-not-say
type: element
confidence: bedrock
title: "When a credential will not describe itself, ask the service that issued it"
content: |
  Established 2026-08-08 by finding-007, closing the item finding-001
  left open since 2026-08-06.

  The rule:

  > A fact about our own credential that the credential will not state
  > is not necessarily unobtainable. The service that issued it holds
  > the same fact, and may expose it as ordinary data.

  **The instance.** Wiz service-account tokens carry `encodedScopes`, a
  base64 bitmask against an internal ordering stave does not have.
  `token_scopes` reports `Opaque` and the permission verbs refuse
  rather than guess — option (a), ratified. That refusal was correct
  and it was also terminal: no amount of decoding gets a grant list out
  of a bitmask whose ordering is unpublished.

  `ServiceAccount.scopes` is a `[String!]!` on a type stave already
  queried, with `clientId` already in the same selection. Matching the
  caller's own client ID answers exactly what the token would not.
  Validated live: 79 scopes readable, and `missing: 0` against the
  twelve the operation registry declares, so those twelve names are
  real strings the server recognises.

  **The second route is opt-in, not a fallback, and the reason
  generalises.** The obvious implementation is a silent fallback inside
  the token decoder. It was rejected: `token_scopes` is a pure function
  on a string and `auth scopes` has always been an offline read, so a
  hidden network call would break the determinism rule in
  `.claude/rules/cli-philosophy.md` and surprise a caller who
  reasonably assumed a scope dump costs nothing. The route is
  `--from-directory`, defaulting off.

  Naming that flag in the opaque-scopes message is a MAP error naming
  its next step, not a guard refusal naming its own ladder. The
  distinction is load-bearing: a wall must stay silent, a map must not.

  **What it does not license, and the discipline is the point.**
  `SCOPE_METADATA_PROVISIONAL` stays `true`. Twelve scope NAMES are
  validated; the per-operation ASSIGNMENT is not. Knowing
  `read:projects` is a real scope says nothing about whether
  `list_issues` requires it, and a credential holding 79 scopes cannot
  distinguish a correct mapping from a generous one because everything
  succeeds either way. Settling that needs a least-privilege
  credential, and the excess of 67 is exactly what prevents it. See
  [[elem-validation-scope-matches-claim-scope]].

  **Hygiene the pattern carries with it.** The directory holding the
  answer holds every other tenant's answer too. The lookup returns on
  the first client-ID match and drops every other record unexamined;
  two tests assert a neighbour's scopes and client ID never survive,
  one on the matcher and one through the binary. A second route to our
  own data must not become a first route to everyone else's.

  Generality: n=1 in this repo. Stated as a pattern because the shape
  is not vendor-specific — an opaque self-description beside a
  queryable directory is a common arrangement — but a second instance
  in a sibling repo is what would promote it from "a thing we did" to
  "a thing we do".
