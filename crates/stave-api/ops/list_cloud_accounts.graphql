# Validated against the vendored schema (F1, 2026-08-06):
# `status` is deprecated (deployments/system-health supersede it) and
# was dropped; `lastScannedAt` + `resourceCount` are stable inventory
# fields.
#
# Widened 2026-08-07 (bd aae-orc-qijl). Every field added then is
# UNVALIDATED against the live API (charter B2, F1). See
# docs/design/widening-notes.md.
#
# `status` and `connector` were on the widening list. Both are still
# deprecated, and `status` is the field the 2026-08-06 correction
# removed on purpose, so neither returns. The schema names the
# successors in its own deprecation text: deployments and the
# system-health counts for `status`, `sourceDeployments` for
# `connector` (via `sourceConnectors`, itself deprecated). Those are
# selected instead. Only the critical and high system-health counts are
# taken; the medium/low/informational three are noise at this altitude.
query ListCloudAccounts($first: Int, $after: String) {
  cloudAccounts(first: $first, after: $after) {
    nodes {
      id
      name
      externalId
      cloudProvider
      firstScannedAt
      lastScannedAt
      resourceCount
      criticalSystemHealthIssueCount
      highSystemHealthIssueCount
      linkedProjects {
        id
        name
        slug
      }
      sourceDeployments {
        id
        name
        type
        status
        lastSeenAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
