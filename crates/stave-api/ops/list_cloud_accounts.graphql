# Validated against the vendored schema (F1, 2026-08-06):
# `status` is deprecated (deployments/system-health supersede it) and
# was dropped; `lastScannedAt` + `resourceCount` are stable inventory
# fields.
query ListCloudAccounts($first: Int, $after: String) {
  cloudAccounts(first: $first, after: $after) {
    nodes {
      id
      name
      externalId
      cloudProvider
      lastScannedAt
      resourceCount
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
