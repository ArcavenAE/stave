# Widened 2026-08-07 (bd aae-orc-qijl). Every field added here is
# UNVALIDATED against the live API (charter B2, F1). See
# docs/design/widening-notes.md.
#
# This selection plus the audit-log one is what runbook A4 (standing
# credential review) was blocked on at steps 3 and 4.
#
# `clientSecret` sits on this type and is a live credential. It is on
# the xtask deny-list and must never be selected here.
query ListServiceAccounts($first: Int, $after: String) {
  serviceAccounts(first: $first, after: $after) {
    nodes {
      id
      name
      clientId
      createdAt
      lastLoginAt
      lastRotatedAt
      expiresAt
      enabled
      scopes
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
