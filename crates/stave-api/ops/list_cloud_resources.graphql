# Validated against the vendored schema (F1, 2026-08-06):
# CloudResource has no `cloudPlatform`; `nativeType` is the native
# cloud type string, `subscriptionName`/`subscriptionExternalId` carry
# the account.
query ListCloudResources($first: Int, $after: String) {
  cloudResources(first: $first, after: $after) {
    nodes {
      id
      name
      type
      nativeType
      subscriptionName
      subscriptionExternalId
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
