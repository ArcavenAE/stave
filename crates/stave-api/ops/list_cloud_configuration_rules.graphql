# Provisional until live introspection (see charter F1).
query ListCloudConfigurationRules($first: Int, $after: String) {
  cloudConfigurationRules(first: $first, after: $after) {
    nodes {
      id
      name
      severity
      enabled
      cloudProvider
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
