[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
hex = "0.4"

serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

# Schema parsing (xtask check-ops). Same crate the SDK uses at runtime,
# so document parsing behaves identically in both places.
graphql-parser.workspace = true

# Credential + endpoint chains and GraphQL execution for `sync-spec`.
# Reusing the SDK keeps one implementation of the chains and puts the
# introspection call in the same audit trail as every other call.
stave-sdk = { path = "../crates/stave-sdk", version = "0.0.1" }
